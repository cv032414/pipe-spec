<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="管徑查詢">
<title>管徑規格查詢</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0D0F12;--bg2:#161921;--bg3:#1E2230;--bg4:#262B3A;
  --text:#E8ECF4;--text2:#9BA3B5;--text3:#6B7489;
  --accent:#4F9EF8;--accent-glow:rgba(79,158,248,0.15);
  --orange:#F59E42;--green:#34D399;
  --radius:14px;--radius-sm:10px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,'SF Pro Display','Noto Sans TC','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.mono{font-family:'SF Mono','Menlo','Courier New',monospace}
.header{
  padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;border-bottom:1px solid var(--bg3);
}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.unit-toggle{display:flex;background:var(--bg3);border-radius:8px;overflow:hidden}
.unit-toggle button{
  padding:6px 12px;font-size:12px;font-weight:600;
  background:none;border:none;color:var(--text3);cursor:pointer;transition:all 0.2s;
}
.unit-toggle button.active{background:var(--accent);color:#fff;border-radius:7px}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 140px}
.selector-group{margin-bottom:14px}
.selector-label{
  font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.8px;
}
.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill-scroll::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:9px 16px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;background:var(--bg3);color:var(--text2);
  border:1.5px solid transparent;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.pill:active{transform:scale(0.96)}
.pill.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size-btn{
  padding:12px 4px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  text-align:center;background:var(--bg3);color:var(--text2);
  border:1.5px solid transparent;cursor:pointer;transition:all 0.15s;
}
.size-btn:active{transform:scale(0.95)}
.size-btn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.search-bar{
  display:flex;align-items:center;gap:8px;background:var(--bg3);
  border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;
}
.search-bar svg{flex-shrink:0}
.search-bar input{
  flex:1;background:none;border:none;color:var(--text);font-size:15px;outline:none;font-family:inherit;
}
.search-bar input::placeholder{color:var(--text3)}
.clear-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 4px;display:none}
.clear-btn.show{display:block}
.result-card{
  background:var(--bg2);border-radius:var(--radius);border:1px solid var(--bg4);
  overflow:hidden;margin-top:16px;animation:slideUp 0.25s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-header{
  padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bg4);
}
.pipe-info{font-size:12px;color:var(--text3);line-height:1.4}
.size-badge{font-size:20px;font-weight:700;color:var(--accent)}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr}
.result-cell{padding:14px 8px;text-align:center;border-right:1px solid var(--bg4)}
.result-cell:nth-child(3){border-right:none}
.result-cell .label{font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.result-cell .val-inch{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.result-cell .val-mm{font-size:13px;margin-top:3px}
.result-cell .val-only{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.od-c{color:var(--accent)}.od-c .val-mm{color:rgba(79,158,248,0.6)}
.id-c{color:var(--green)}.id-c .val-mm{color:rgba(52,211,153,0.6)}
.wl-c{color:var(--orange)}.wl-c .val-mm{color:rgba(245,158,66,0.6)}
.pipe-visual{display:flex;align-items:center;justify-content:center;padding:16px;border-top:1px solid var(--bg4)}
.pipe-ring{border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--accent);position:relative;background:var(--bg4)}
.pipe-inner{border-radius:50%;background:var(--bg);border:2px dashed var(--green);display:flex;align-items:center;justify-content:center}
.pipe-inner span{font-size:9px;color:var(--text3)}
.wall-tag{position:absolute;top:-10px;right:-10px;background:var(--orange);color:#000;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center}
.empty-state p{color:var(--text3);font-size:13px}
</style>
</head>

// State
var S={mat:"Carbon Steel & PVC",sch:"Standard",size:null,unit:"dual",search:""};
var MATS=Object.keys(DATA);
var matList=[], schList=[], sizeList=[];

function toMM(v){var r=v*25.4;return Math.round(r*1000000)/1000000+''}
function parseFrac(s){
  s=s.trim();
  var sp=s.indexOf(' ');
  if(sp>-1) return parseFloat(s.substring(0,sp))+parseFrac(s.substring(sp+1));
  var sl=s.indexOf('/');
  if(sl>-1) return parseFloat(s.substring(0,sl))/parseFloat(s.substring(sl+1));
  return parseFloat(s);
}
function sortS(a){return a.slice().sort(function(x,y){return parseFrac(x)-parseFrac(y)})}
function isCI(){return S.mat.indexOf("Cast Iron")>-1}
function esc(s){var d=document.createElement('span');d.textContent=s;return d.innerHTML}

function getSizes(){
  var sc=DATA[S.mat][S.sch];
  return Object.keys(sc["I.D."]||sc["O.D."]);
}

// Render
function rMat(){
  matList=MATS;
  var h='';
  for(var i=0;i<matList.length;i++){
    h+='<div class="pill'+(matList[i]===S.mat?' active':'')+'" data-mi="'+i+'">'+esc(matList[i])+'</div>';
  }
  document.getElementById('matPills').innerHTML=h;
}
function rSch(){
  schList=Object.keys(DATA[S.mat]);
  if(schList.indexOf(S.sch)<0) S.sch=schList[0];
  var h='';
  for(var i=0;i<schList.length;i++){
    h+='<div class="pill'+(schList[i]===S.sch?' active':'')+'" data-si="'+i+'">'+esc(schList[i])+'</div>';
  }
  document.getElementById('schPills').innerHTML=h;
}
function rSize(){
  var all=sortS(getSizes());
  if(S.search) all=all.filter(function(s){return s.indexOf(S.search)>-1});
  sizeList=all;
  if(all.indexOf(S.size)<0) S.size=null;
  var h='';
  for(var i=0;i<all.length;i++){
    h+='<div class="size-btn'+(all[i]===S.size?' active':'')+'" data-zi="'+i+'">'+esc(all[i])+'"</div>';
  }
  document.getElementById('sizeGrid').innerHTML=h;
  rResult();
}
function rResult(){
  var el=document.getElementById('resultArea');
  if(!S.size){el.innerHTML='<div class="empty-state"><p style="font-size:32px;margin-bottom:8px;opacity:0.2">&#9711;</p><p>選擇尺寸以查看規格</p></div>';return}
  var sc=DATA[S.mat][S.sch], ci=isCI(), u=S.unit;
  var od,id,wl;
  if(ci){od=sc["O.D."]?sc["O.D."][S.size]:undefined;id=sc["I.D."]?sc["I.D."][S.size]:undefined;wl=sc["Wall"]?sc["Wall"][S.size]:undefined}
  else{od=OD[S.size];id=sc["I.D."]?sc["I.D."][S.size]:undefined;wl=sc["Wall"]?sc["Wall"][S.size]:undefined}

  function cell(label,val,cc){
    var h='<div class="result-cell '+cc+'"><div class="label">'+label+'</div>';
    if(val===undefined){h+='<div class="val-inch">—</div>'}
    else if(u==='mm'){h+='<div class="val-only">'+toMM(val)+' mm</div>'}
    else if(u==='inch'){h+='<div class="val-inch">'+val.toFixed(3)+'"</div>'}
    else{h+='<div class="val-inch">'+val.toFixed(3)+'"</div><div class="val-mm">'+toMM(val)+' mm</div>'}
    return h+'</div>';
  }

  var h='<div class="result-card"><div class="result-header"><div class="pipe-info">'+esc(S.mat)+'<br>'+esc(S.sch)+'</div><div class="size-badge">'+esc(S.size)+'"</div></div>';
  h+='<div class="result-grid">';
  h+=cell('O.D. 外徑',od,'od-c');
  h+=cell('I.D. 內徑',id,'id-c');
  h+=cell('Wall 壁厚',wl,'wl-c');
  h+='</div>';
  if(!ci&&od&&id&&wl){
    var op=Math.min(110,Math.max(50,od*7)),ip=Math.min(op-10,Math.max(20,id*7));
    h+='<div class="pipe-visual"><div class="pipe-ring" style="width:'+op+'px;height:'+op+'px"><div class="pipe-inner" style="width:'+ip+'px;height:'+ip+'px"><span>截面</span></div><div class="wall-tag">'+wl.toFixed(3)+'"</div></div></div>';
  }
  h+='</div>';
  el.innerHTML=h;
}

// Events (all via delegation with data-index, no inline onclick)
document.getElementById('matPills').addEventListener('click',function(e){
  var t=e.target.closest('[data-mi]');if(!t)return;
  S.mat=matList[parseInt(t.getAttribute('data-mi'))];S.size=null;S.search='';
  document.getElementById('searchInput').value='';
  document.getElementById('clearBtn').classList.remove('show');
  rMat();rSch();rSize();
});
document.getElementById('schPills').addEventListener('click',function(e){
  var t=e.target.closest('[data-si]');if(!t)return;
  S.sch=schList[parseInt(t.getAttribute('data-si'))];S.size=null;
  rSch();rSize();
});
document.getElementById('sizeGrid').addEventListener('click',function(e){
  var t=e.target.closest('[data-zi]');if(!t)return;
  S.size=sizeList[parseInt(t.getAttribute('data-zi'))];
  rSize();
  setTimeout(function(){var c=document.querySelector('.result-card');if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'})},60);
});
document.getElementById('unitToggle').addEventListener('click',function(e){
  var t=e.target.closest('[data-unit]');if(!t)return;
  S.unit=t.getAttribute('data-unit');
  var btns=document.querySelectorAll('.unit-toggle button');
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  t.classList.add('active');rResult();
});
document.getElementById('searchInput').addEventListener('input',function(e){
  S.search=e.target.value.trim();
  document.getElementById('clearBtn').classList.toggle('show',!!e.target.value);
  rSize();
});
document.getElementById('clearBtn').addEventListener('click',function(){
  S.search='';document.getElementById('searchInput').value='';
  document.getElementById('clearBtn').classList.remove('show');rSize();
});

// Init
rMat();rSch();rSize();
})();
</script>
